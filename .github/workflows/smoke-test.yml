name: Smoke Test | API Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Run daily at 06:00 UTC to catch upstream API changes early
    - cron: "0 6 * * *"

env:
  INTERLYNK_SECURITY_TOKEN: ${{ secrets.INTERLYNK_SECURITY_TOKEN }}
  # Test fixture — override via repository variables if needed
  TEST_PRODUCT: ${{ vars.SMOKE_TEST_PRODUCT || 'AlphaT' }}
  TEST_ENV: ${{ vars.SMOKE_TEST_ENV || 'Development' }}

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Smoke test — prods
        run: |
          uv run python -m pylynk prods --output=json | python -c "
          import sys, json
          prods = json.load(sys.stdin)
          assert len(prods) > 0, 'Expected at least one product'
          assert all('NAME' in p and 'ID' in p for p in prods), 'Missing fields'
          print(f'OK: {len(prods)} products')
          "

      - name: Resolve latest version
        id: resolve
        run: |
          # vers prints info messages to stdout when no --ver given,
          # so capture to file and extract the JSON portion
          uv run python -m pylynk vers \
            --prod "$TEST_PRODUCT" \
            --env "$TEST_ENV" \
            --output=json > vers_output.txt 2>&1

          VER=$(python -c "
          import json
          with open('vers_output.txt') as f:
              lines = f.readlines()
          json_start = next(i for i, l in enumerate(lines) if l.strip().startswith('['))
          data = json.loads(''.join(lines[json_start:]))
          assert len(data) > 0, 'Expected at least one version'
          print(data[0]['VERSION'])
          ")
          echo "TEST_VERSION=$VER" >> "$GITHUB_ENV"
          echo "Resolved version: $VER"

      - name: Smoke test — vers
        run: |
          # vers lists all versions (no --ver flag), so capture and extract JSON
          uv run python -m pylynk vers \
            --prod "$TEST_PRODUCT" \
            --env "$TEST_ENV" \
            --output=json > vers_test.txt 2>&1
          python -c "
          import json
          with open('vers_test.txt') as f:
              lines = f.readlines()
          json_start = next(i for i, l in enumerate(lines) if l.strip().startswith('['))
          vers = json.loads(''.join(lines[json_start:]))
          assert len(vers) > 0, 'Expected at least one version'
          print(f'OK: {len(vers)} versions')
          "

      - name: Smoke test — status
        run: |
          uv run python -m pylynk status \
            --prod "$TEST_PRODUCT" \
            --env "$TEST_ENV" \
            --ver "$TEST_VERSION" \
            --output=json | python -c "
          import sys, json
          statuses = json.load(sys.stdin)
          assert len(statuses) > 0, 'Expected status entries'
          keys = {s['ACTION KEY'] for s in statuses}
          assert 'vulnScanStatus' in keys, 'Missing vulnScanStatus'
          print(f'OK: {len(statuses)} status entries')
          "

      - name: Smoke test — download
        run: |
          echo "Downloading version: $TEST_VERSION"
          uv run python -m pylynk download \
            --prod "$TEST_PRODUCT" \
            --env "$TEST_ENV" \
            --ver "$TEST_VERSION" | python -c "
          import sys, json
          doc = json.load(sys.stdin)
          assert 'bomFormat' in doc or 'spdxVersion' in doc, 'Not a valid SBOM'
          fmt = doc.get('bomFormat', doc.get('spdxVersion', 'unknown'))
          print(f'OK: downloaded {fmt} SBOM')
          "

      - name: Smoke test — vulns
        run: |
          # vulns may print "No vulnerabilities found" instead of JSON when empty
          uv run python -m pylynk vulns \
            --prod "$TEST_PRODUCT" \
            --env "$TEST_ENV" \
            --ver "$TEST_VERSION" \
            --output=json > vulns_output.txt 2>&1
          python -c "
          import json
          with open('vulns_output.txt') as f:
              text = f.read().strip()
          if 'No vulnerabilities found' in text:
              print('OK: 0 vulnerabilities')
          else:
              data = json.loads(text)
              print(f'OK: {len(data)} vulnerabilities')
          "

      - name: Smoke test — report attribution
        run: |
          # Capture to file to avoid BrokenPipeError from piping to head
          uv run python -m pylynk report \
            --type attribution \
            --prod "$TEST_PRODUCT" \
            --env "$TEST_ENV" \
            --ver "$TEST_VERSION" > report_output.txt 2>&1
          python -c "
          with open('report_output.txt') as f:
              header = f.readline().strip()
          assert 'Component Name' in header, f'Unexpected header: {header}'
          print('OK: attribution report header valid')
          "

      - name: Notify Slack on failure
        if: failure()
        uses: slackapi/slack-github-action@b0fa283ad8fea605de13dc3f449259339835fc52 # v2.1.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": ":red_circle: pylynk smoke test failed",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ":red_circle: *pylynk smoke test failed*\n*Branch:* `${{ github.ref_name }}`\n*Trigger:* ${{ github.event_name }}\n*Run:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View logs>"
                  }
                }
              ]
            }
